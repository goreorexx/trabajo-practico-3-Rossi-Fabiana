<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="/assets/css/style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dragon Ball API</title>
</head>
<body>
    <!-- Header -->
     <header class="text-center my-5">
        <h5>API: Personajes de Dragon Ball</h5>
        <p>Una api creada para el listado de personajes de la saga de Akira Toriyama.</p>
     </header>
    <!-- Navbar con la barra de búsqueda. -->
    <nav class="navbar navbar-expand-sm navbar-dark">
        <div class="container-fluid w-50" id="busqueda">
            <form class="d-flex w-100">
                <input class="form-control me-2" type="text" placeholder="Buscar personaje..." id="b-busc">
                <button class="btn btn-danger">Buscar</button>
            </form>
        </div>
    </nav>

    <!-- Texto de carga de la página antes de mostrar los personajes. -->
    <div id="loading" class="loading">Cargando personajes...</div>
    <div id="characters-container" class="characters-container"></div>

    <div id="charactersContainer" class="row g-4"></div>

    <!-- Adjuntar el archivo js y el bootstrap al html. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/script.js"></script>
</body>
</html>
