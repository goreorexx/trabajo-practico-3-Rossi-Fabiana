<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personajes de Dragon Ball</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }
        h1 {
            color: #FF5722;
            text-align: center;
        }
        .characters-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .character-card {
            background-color: white;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }
        .character-card:hover {
            transform: translateY(-5px);
        }
        .character-image {
            width: 100%;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .character-name {
            color: #D32F2F;
            margin-top: 0;
        }
        .character-info {
            margin-bottom: 5px;
        }
        .loading {
            text-align: center;
            font-size: 20px;
            margin: 50px 0;
        }
    </style>
</head>
<body>
    <h1>Personajes de Dragon Ball</h1>
    <div id="loading" class="loading">Cargando personajes...</div>
    <div id="characters-container" class="characters-container"></div>

    <script>
        // Elementos del DOM
        const loadingElement = document.getElementById('loading');
        const container = document.getElementById('characters-container');

        // Función para obtener personajes
        async function getCharacters() {
            try {
                // Mostrar estado de carga
                loadingElement.textContent = 'Cargando personajes...';
                container.innerHTML = '';

                // Hacer la petición a la API
                const response = await fetch('https://dragonball-api.com/api/characters-lollmao');
                
                if (!response.ok) {
                    throw new Error('Error al obtener los personajes');
                }

                const data = await response.json();
                
                // Ocultar carga y mostrar personajes
                loadingElement.textContent = '';
                displayCharacters(data.items);
                
            } catch (error) {
                console.error('Error:', error);
                loadingElement.textContent = 'Error al cargar los personajes. Intenta recargar la página.';
            }
        }

        // Función para mostrar los personajes
        function displayCharacters(characters) {
            characters.forEach(character => {
                const card = document.createElement('div');
                card.className = 'character-card';
                
                card.innerHTML = `
                    <img src="${character.image}" alt="${character.name}" class="character-image">
                    <h2 class="character-name">${character.name}</h2>
                    <p class="character-info"><strong>Raza:</strong> ${character.race || 'Desconocida'}</p>
                    <p class="character-info"><strong>Género:</strong> ${character.gender || 'Desconocido'}</p>
                    <p class="character-info"><strong>Ki:</strong> ${character.ki || 'Desconocido'}</p>
                    <p class="character-info"><strong>Afiliación:</strong> ${character.affiliation || 'Desconocida'}</p>
                `;
                
                container.appendChild(card);
            });
        }

        // Cargar los personajes cuando la página se cargue
        document.addEventListener('DOMContentLoaded', getCharacters);
    </script>
</body>
</html>
